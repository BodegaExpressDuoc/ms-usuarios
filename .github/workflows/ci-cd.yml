name: CI/CD ms-usuarios

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  SERVICIO: ms-usuarios

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: sh mvnw -B verify

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provisionar repositorio en ECR (si no existe)
        run: |
          aws ecr describe-repositories --repository-names "$SERVICIO" > /dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$SERVICIO"

      - name: Iniciar sesión en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir la imagen
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION=$(sh mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          docker build \
            -t "$REGISTRO/$SERVICIO:$VERSION" \
            -t "$REGISTRO/$SERVICIO:${GITHUB_SHA::7}" \
            -t "$REGISTRO/$SERVICIO:latest" .
          docker push --all-tags "$REGISTRO/$SERVICIO"

      - name: Desplegar en la EC2 (SSM)
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"sudo -iu ec2-user bash bodegaexpress-infra/cicd.sh $SERVICIO\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          ESTADO=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "Resultado del despliegue: $ESTADO"
          [ "$ESTADO" = "Success" ]
