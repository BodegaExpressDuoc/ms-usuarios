spring:
  application:
    name: ms-usuarios

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${USUARIOS_DB_URL:jdbc:postgresql://localhost:5432/bodega_usuarios}
    username: ${USUARIOS_DB_USERNAME}
    password: ${USUARIOS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}

gateway:
  # Secreto que agrega el API Gateway en el header X-Gateway-Secret. Vacío = no se exige (local y tests).
  secret: ${GATEWAY_SECRET:}

server:
  address: ${USUARIOS_ADDRESS:127.0.0.1}
  port: ${USUARIOS_PORT:8081}
