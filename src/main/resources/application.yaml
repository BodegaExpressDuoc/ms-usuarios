spring:
  application:
    name: ms-usuarios

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${USUARIOS_DB_URL:jdbc:postgresql://localhost:5432/bodega_usuarios}
    username: ${USUARIOS_DB_USERNAME:postgres}
    password: ${USUARIOS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${USUARIOS_PORT:8081}
